version: '3.8'

services:
  # 1. Central Threat Hub (FastAPI + SQLite WAL)
  threat-hub:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nexusshield-hub
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NEXUS_API_KEY=nexus_dev_key_2026
      - NEXUS_ADMIN_TOKEN=nexus_admin_secret_2026
      - BAN_TTL_HOURS=24
    volumes:
      - hub-data:/app/hub
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # 2. Site A Protected Spoke (Express Node.js on port 3000)
  site-a:
    image: node:20-alpine
    container_name: nexusshield-site-a
    working_dir: /app
    restart: unless-stopped
    depends_on:
      threat-hub:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      - PORT=3000
      - SITE_NAME=Site-A
      - CLIENT_ID=client_A
      - HUB_URL=http://threat-hub:8000
      - NEXUS_API_KEY=nexus_dev_key_2026
    command: node nexus-client/siteA.js

  # 3. Site B Protected Spoke (Express Node.js on port 3001)
  site-b:
    image: node:20-alpine
    container_name: nexusshield-site-b
    working_dir: /app
    restart: unless-stopped
    depends_on:
      threat-hub:
        condition: service_healthy
    ports:
      - "3001:3001"
    volumes:
      - .:/app
    environment:
      - PORT=3001
      - SITE_NAME=Site-B
      - CLIENT_ID=client_B
      - HUB_URL=http://threat-hub:8000
      - NEXUS_API_KEY=nexus_dev_key_2026
    command: node nexus-client/siteB.js

  # 4. NexusShield SOC & Client Portal Dashboard
  dashboard:
    image: node:20-alpine
    container_name: nexusshield-dashboard
    working_dir: /app/dashboard
    restart: unless-stopped
    depends_on:
      - threat-hub
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    environment:
      - VITE_HUB_API=http://localhost:8000
      - VITE_NEXUS_API_KEY=nexus_dev_key_2026
      - VITE_NEXUS_ADMIN_TOKEN=nexus_admin_secret_2026
    command: npm run dev -- --host 0.0.0.0

volumes:
  hub-data:
