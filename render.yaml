# NexusShield - 1-Click Render Infrastructure Blueprint
# Documentation: https://render.com/docs/blueprint-spec

version: "1"

services:
  - type: web
    name: nexusshield-threat-hub
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn hub.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NEXUS_API_KEY
        generateValue: true
      - key: NEXUS_ADMIN_TOKEN
        generateValue: true
      - key: BAN_TTL_HOURS
        value: "24"
      - key: PORT
        value: "10000"
      - key: PYTHON_VERSION
        value: "3.11.0"
